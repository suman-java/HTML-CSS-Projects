<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>15 August Independence Day</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="poster">

        <!-- ================= LEFT SECTION ================= -->

        <div class="left">

            <!-- Heading -->
            <h1>
                15<sup>th</sup> AUGUST
            </h1>

            <h2>
                Independence Day of India
            </h2>

            <p class="message">
                Let's celebrate independence day having freedom in mind,
                faith in heart, and memories of our heroes in the heart.
            </p>


            <!-- Tricolor -->
            <div class="orange"></div>
            <div class="white"></div>
            <div class="green"></div>


            <!-- Ashoka Chakra -->
            <div class="chakra">

                <div class="chakra-center"></div>

                <span class="line l1"></span>
                <span class="line l2"></span>
                <span class="line l3"></span>
                <span class="line l4"></span>
                <span class="line l5"></span>
                <span class="line l6"></span>
                <span class="line l7"></span>
                <span class="line l8"></span>
                <span class="line l9"></span>
                <span class="line l10"></span>
                <span class="line l11"></span>
                <span class="line l12"></span>
                <span class="line l13"></span>
                <span class="line l14"></span>
                <span class="line l15"></span>
                <span class="line l16"></span>
                <span class="line l17"></span>
                <span class="line l18"></span>
                <span class="line l19"></span>
                <span class="line l20"></span>
                <span class="line l21"></span>
                <span class="line l22"></span>
                <span class="line l23"></span>
                <span class="line l24"></span>

            </div>

        </div>


        <!-- ================= RIGHT SECTION ================= -->

        <div class="right">

            <!-- Photo Frame -->

            <div class="photo-frame">

                <img
                    src="./suman.jpg"
                    alt="My Photo"
                    class="my-photo"
                >

            </div>


            <!-- Name -->

            <div class="name">
                Suman Kumar
            </div>

        </div>

    </div>

</body>

</html>
